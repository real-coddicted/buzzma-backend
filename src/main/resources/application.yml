spring:
  application:
    name: java-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mobo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8081}

