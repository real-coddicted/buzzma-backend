spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buzzma}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        stringtype: unspecified
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

app:
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:change-me-access-secret-min-32-chars!!}
    refresh-secret: ${JWT_REFRESH_SECRET:change-me-refresh-secret-min-32-chars!!}
    access-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
    refresh-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  cooling-settler:
    interval-ms: ${COOLING_SETTLER_INTERVAL_MS:3600000}
  wallet:
    max-balance-paise: ${WALLET_MAX_BALANCE_PAISE:100000000}
